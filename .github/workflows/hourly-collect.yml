name: Hourly data collection

on:
  schedule:
    # 13 minutes past the hour, every hour (UTC) - off the :00 mark to avoid
    # GitHub's top-of-hour scheduling crunch.
    - cron: "13 * * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-jobs.txt

      - name: Collect recent marine data
        env:
          DB_DSN: ${{ secrets.DB_DSN }}
        run: python marine_recent.py

      - name: Collect recent rainfall
        env:
          DB_DSN: ${{ secrets.DB_DSN }}
        run: python weather_pipeline.py
