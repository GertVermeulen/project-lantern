# Recent rainfall + marine snapshot, run on a schedule. Keeps weather_hourly
# and marine_hourly topped up so the live-prediction trailing-24h feature
# window (used by app.py) always has fresh data to aggregate.
name: Update live feeds

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

jobs:
  live-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-jobs.txt

      - run: python weather_pipeline.py
        env:
          DB_DSN: ${{ secrets.DB_DSN }}

      - run: python marine_recent.py
        env:
          DB_DSN: ${{ secrets.DB_DSN }}
